<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Fundo Preto -->
  <rect width="1000" height="1000" fill="#000000" />

  <!-- Ícone do Tablet (iPad) -->
  <g id="tablet">
    <!-- Corpo do tablet (borda branca) -->
    <rect x="310" y="160" width="380" height="490" rx="35" ry="35" fill="#ffffff" />
    
    <!-- Tela do tablet (furo preto) -->
    <rect x="360" y="195" width="280" height="365" rx="5" ry="5" fill="#000000" />
    
    <!-- Botão Home (círculo/retângulo arredondado) -->
    <rect x="478" y="590" width="44" height="30" rx="12" ry="12" fill="#000000" />
  </g>

  <!-- Texto C4 -->
  <!-- Usando uma fonte sans-serif geométrica e bold, ajustada para parecer com a imagem -->
  <text x="500" y="850" font-family="Arial, Helvetica, sans-serif" font-size="240" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="5">
    C4
  </text>
</svg>